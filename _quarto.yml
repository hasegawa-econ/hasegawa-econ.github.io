project:
  type: website
  output-dir: docs

website:
  title: "Your Name"
  description: "Researcher | Your Field | Your Institution"
  favicon: assets/favicon.ico

  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Research"
        href: research.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/yourusername
      - icon: twitter
        href: https://twitter.com/yourusername
      - icon: envelope
        href: mailto:you@example.com

  page-footer:
    left: "© 2024 Your Name"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    highlight-style: github
