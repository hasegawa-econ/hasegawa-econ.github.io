project:
  type: website
  output-dir: docs

# 通常は public（ダッシュボード除外）。ローカル閲覧は --profile local
profile:
  default: public

website:
  title: "シロのブログ"
  description: "データサイエンス・統計・経済学の学習ログと読書メモ"
  favicon: assets/favicon.ico

  navbar:
    left:
      - text: "ホーム"
        href: index.qmd
      - text: "ブログ"
        href: blog/index.qmd

  page-footer:
    left: "© 2026 シロ"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    code-fold: false
    code-tools: false
    highlight-style: github
    fontsize: 16px
    linestretch: 1.95
